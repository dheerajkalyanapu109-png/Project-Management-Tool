{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Management Tool</title><link rel="stylesheet" href="{% static 'tracker.css' %}"></head>
<body data-auth="{% if user.is_authenticated %}1{% else %}0{% endif %}">
<header class="bar"><a class="logo" href="{% url 'dashboard' %}">▦ Project Management Tool</a>
<nav>
 {% if user.is_authenticated %}<a href="{% url 'notifications' %}">🔔 <b id="notif-count" class="badge"{% if not unread %} hidden{% endif %}>{{ unread }}</b></a>
 <span class="muted">@{{ user.username }}</span>
 <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="link">Log out</button></form>
 {% else %}<a href="{% url 'login' %}">Log in</a><a href="{% url 'register' %}">Sign up</a>{% endif %}
</nav></header>
<main>{% for m in messages %}<p class="msg">{{ m }}</p>{% endfor %}{% block content %}{% endblock %}</main>
<div id="toast" role="status"></div>
<script src="{% static 'tracker.js' %}"></script>
</body></html>
